name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies & Build
        run: |
          bun install
          bun run build

      - name: Show build output (debug)
        if: always()
        run: |
          echo "Working dir: $(pwd)"
          echo "Tree of .output/public (up to 3 levels):"
          if [ -d ".output/public" ]; then
            ls -la .output/public || true
            find .output/public -maxdepth 3 -type f -print || true
            echo "Index file exists?:"
            [ -f .output/public/index.html ] && echo "index.html found" || echo "index.html NOT found"
          else
            echo ".output/public directory not found"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './.output/public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
